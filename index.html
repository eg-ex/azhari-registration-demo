<style>
  .azhari-frame-wrap { position: relative; width: 100%; height: 100vh; height: 100dvh; background: #f7f8f7; }
  .azhari-frame-wrap iframe { display: block; width: 100%; height: 100%; border: 0; }
  .azhari-loading {
    position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
    background: radial-gradient(circle at 50% 45%, #ffffff 0, #f4f6f2 55%, #eceee7 100%);
    transition: opacity .6s ease, visibility .6s;
  }
  .azhari-loading.done { opacity: 0; visibility: hidden; }
  .azhari-loader { position: relative; width: 132px; height: 132px; display: grid; place-items: center; }
  .azhari-loader::before {
    content: ""; position: absolute; inset: -10px; border-radius: 50%;
    background: radial-gradient(circle, rgba(184,150,62,.22) 0, rgba(184,150,62,0) 70%);
    animation: azhari-breathe 2.4s ease-in-out infinite;
  }
  .azhari-ring {
    position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 0deg, rgba(15,107,63,0) 0deg, #0f6b3f 200deg, #b8963e 330deg, rgba(184,150,62,0) 360deg);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
    animation: azhari-spin 1.4s cubic-bezier(.55,.15,.45,.85) infinite;
  }
  .azhari-loader img {
    position: relative; width: 104px; height: 104px; border-radius: 50%; object-fit: contain; background: #fff;
    box-shadow: 0 10px 30px rgba(15,60,35,.16), 0 0 0 1px rgba(184,150,62,.35);
    animation: azhari-float 2.4s ease-in-out infinite;
  }
  .azhari-caption { font: 600 15px 'IBM Plex Sans Arabic', Tahoma, Arial, sans-serif; color: #0a0a0a; letter-spacing: .3px; }
  .azhari-caption span { display: inline-block; animation: azhari-dot 1.4s infinite; opacity: .2; }
  .azhari-caption span:nth-child(2) { animation-delay: .2s; }
  .azhari-caption span:nth-child(3) { animation-delay: .4s; }
  @keyframes azhari-spin { to { transform: rotate(360deg); } }
  @keyframes azhari-breathe { 0%, 100% { transform: scale(.92); opacity: .6; } 50% { transform: scale(1.06); opacity: 1; } }
  @keyframes azhari-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  @keyframes azhari-dot { 0%, 100% { opacity: .2; } 40% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .azhari-ring { animation-duration: 3s; }
    .azhari-loader::before, .azhari-loader img, .azhari-caption span { animation: none; opacity: 1; }
  }
</style>
<div class="azhari-frame-wrap">
  <div class="azhari-loading" id="azhari-loading" role="status" aria-label="جارٍ التحميل">
    <div class="azhari-loader">
      <div class="azhari-ring"></div>
      <img id="azhari-logo" alt="سلاح الأزهري">
    </div>
    <div class="azhari-caption">سلاح الأزهري<span>.</span><span>.</span><span>.</span></div>
  </div>
  <iframe id="azhari-frame" title="تسجيل الطلاب" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <script>
    (function () {
      var k = 'L3ZlZC5zcmVrcm93LjgwNXJjYWUubm9pdGFydHNpZ2VyLWlyYWh6YS1sYS1oYWxhcy8vOnNwdHRo';
      var base = atob(k).split('').reverse().join('');
      var frame = document.getElementById('azhari-frame');
      document.getElementById('azhari-logo').src = base + 'logo.webp';
      frame.onload = function () { setTimeout(function () { document.getElementById('azhari-loading').classList.add('done'); }, 400); };
      frame.src = base;
      document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
      document.addEventListener('keydown', function (e) {
        var key = (e.key || '').toLowerCase(), ctrl = e.ctrlKey || e.metaKey;
        if (key === 'f12' || (ctrl && e.shiftKey && 'ijck'.indexOf(key) > -1 && key.length === 1) ||
            (ctrl && e.altKey && 'ijc'.indexOf(key) > -1 && key.length === 1) || (ctrl && (key === 'u' || key === 's'))) {
          e.preventDefault(); e.stopPropagation();
        }
      }, true);
    })();
  </script>
</div>
